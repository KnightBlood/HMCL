[package]
name = "hmcl-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "hmcl_core"
path = "src/lib.rs"

[dependencies]
flate2 = "1.1"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
